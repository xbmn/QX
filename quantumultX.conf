[general]
# 节点存活/延迟探测地址，访问204无内容接口，用来判断节点连通性
server_check_url= http://www.gstatic.com/generate_204
# 节点探测超时，单位毫秒，超过时间判定节点失效
server_check_timeout = 3000
# 当前配置文件在QX面板显示的图标地址
profile_img_url=https://github.githubassets.com/images/modules/site/integrators/google.png
# 获取节点出口IP归属地脚本，二选一即可，用于面板展示节点地区
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# 远程资源解析器，用于解析订阅片段、远程脚本
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# 排除指定IP段，这些流量完全绕过QX代理，直接走系统网络
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
# UDP端口白名单，已注释未启用；放行指定范围UDP端口
#udp_whitelist=1-442, 444-65535
# 根据WiFi名称自动切换QX运行模式，已注释关闭
# filter：启用分流规则；xxx:all_direct：连接该WiFi全部流量直连不走代理
#running_mode_trigger=filter, filter, wifi1:all_direct, wifi2: all_direct
# DNS排除列表，列表内域名不经过QX DNS处理，直接使用系统DNS解析，避免银行/出行APP异常
dns_exclusion_list=*.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
# UDP丢弃列表：丢弃443端口、STUN、QUIC数据包；开启后Hysteria2(QUIC协议)节点会无法使用
udp_drop_list = 443, STUN, QUIC

[dns]
# 不使用系统DNS服务器，全部使用下方自定义DNS
no-system
# 默认DNS服务器，未匹配域名规则的域名全部由此解析；国内公共DNS 阿里
server = 223.5.5.5
# 国内公共DNS 腾讯
server = 119.29.29.29

[policy]
# 静态策略组【节点选择】，可选：自动选择；面板手动切换节点入口
static=节点选择, 自动选择, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
# 自动选择策略组；正则过滤节点标签；900秒测速，20ms延迟容差；alive‑checking=false不执行存活探测，仅靠测速判断
url-latency-benchmark=自动选择, server-tag-regex=^(?!.*(?:网易|墨鱼)).*$, check-interval=900, tolerance=20, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Quantumult_X.png
# 静态策略组【国外媒体】，可选策略：节点选择、美国节点；流媒体网站匹配到此组
static=国外媒体, 节点选择, 美国节点, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Streaming.png
# 静态策略组【电报信息】，可选策略：节点选择；Telegram流量匹配到此组
static=电报信息, 节点选择, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
# 静态策略组【微软服务】，可选策略：全球直连、节点选择；微软相关域名匹配到此组
static=微软服务, 全球直连, 节点选择, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png
# 静态策略组【苹果服务】，可选策略：节点选择、全球直连；苹果域名匹配到此组
static=苹果服务, 节点选择, 全球直连, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Apple.png
# 静态策略组【全球直连】，可选策略：direct直连、节点选择、自动选择；国内域名主要走此策略
static=全球直连, direct, 节点选择, 自动选择, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
# 静态策略组【漏网之鱼】兜底策略；未匹配任何分流规则的流量进入此策略
static=漏网之鱼, 节点选择, 全球直连, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png
# 香港节点策略组；正则匹配标签含港/HK/Hong，排除台日韩新美；1200秒测速，tolerance=0严格按延迟排序
url-latency-benchmark=香港节点, server-tag-regex=(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
# 美国节点策略组；正则匹配标签含美/US/United States，排除港台日韩新
url-latency-benchmark=美国节点, server-tag-regex=(?=.*(美|US|(?i)United States))^((?!(港|台|日|韩|新)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
# 日本节点策略组；正则匹配标签含日/JP/Japan，排除港台韩新美
url-latency-benchmark=日本节点, server-tag-regex=(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
# 韩国节点策略组；正则匹配标签含韩/KR/Korea，排除港台日新美
url-latency-benchmark=韩国节点, server-tag-regex=(?=.*(韩|KR|(?i)Korea))^((?!(港|台|日|新|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png
# 台湾节点策略组；正则匹配标签含台/TW/Taiwan，排除港日韩新美
url-latency-benchmark=台湾节点, server-tag-regex=(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
# 新加坡节点策略组；正则匹配标签含新/SG/Singapore，排除港台日韩美
url-latency-benchmark=新加坡节点, server-tag-regex=(?=.*(新|SG|(?i)Singapore))^((?!(港|台|日|韩|美)).)*$, check-interval=1200, tolerance=0, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png

